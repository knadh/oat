name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to publish (e.g. v1.0.1 or 1.0.1)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Select release tag
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="v${REQUESTED_VERSION#v}"
          else
            tag="$PUSHED_TAG"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable release version such as v1.0.1."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify package version matches selected tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          # make publish derives the package version using git describe.
          if [[ "$(git describe --tags --abbrev=0)" != "$RELEASE_TAG" ]]; then
            echo "::error::The Makefile would publish a different version than $RELEASE_TAG."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install publishing and build tools
        # Trusted publishing requires npm >= 11.5.1.
        run: npm install -g npm@11 esbuild

      - name: Build and publish
        run: make publish PKG_MGR=npm
