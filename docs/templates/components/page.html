{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ config.title }}{% endblock %}

{% block content %}
<section id="{{ page.slug }}" class="demo-section card card-float">
  <h1 class="card-title">
    {{ page.title }}
    {% if page.extra.requires_js | default(value=false) %}
    <span class="badge" data-variant="warning" aria-description="Requires Javascript">JS</span>
    {% endif %}
  </h1>
  {{ page.content | safe }}
</section>
{% endblock %}
